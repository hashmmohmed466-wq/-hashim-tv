<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>متجر الإلكترونيات</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; direction: rtl; background:#fff; color:#222 }
    .category { margin-top: 24px; }
    .category h2 { margin: 0 0 8px 0; }
    .category .subtitle { color:#555; font-size:13px; margin-bottom:6px }
    .product { border: 1px solid #eee; padding: 10px; margin: 8px 0; border-radius: 6px; display:flex; align-items:center }
    .product img { max-width: 80px; max-height:80px; object-fit:cover; border-radius:6px; margin-left:12px }
    .info { flex:1 }
    .name { font-weight: bold; margin-bottom:6px }
    .desc { color:#555; font-size:14px }
    .tags { margin-top:8px }
    .tag { background:#f0f0f0;padding:4px 8px;border-radius:12px;margin-left:6px;font-size:12px;display:inline-block }
    h1 { margin-top:0 }
    .lang-switch { float:left; font-size:14px }
  </style>
</head>
<body>
  <h1>فئات المبيعات — أجهزة إلكترونية</h1>
  <div id="content">جارٍ التحميل...</div>

  <script>
    // ننزل products.json و translations.json ونستخدم الترجمة إذا كانت متاحة
    Promise.all([
      fetch('products.json').then(r => r.json()),
      fetch('translations.json').then(r => r.json()).catch(() => ({}))
    ])
    .then(([products, translations]) => {
      // grouped by category key as-is
      const grouped = {};
      products.forEach(p => {
        grouped[p.category] = grouped[p.category] || [];
        grouped[p.category].push(p);
      });

      const container = document.getElementById('content');
      container.innerHTML = '';

      for (const category in grouped) {
        const catDiv = document.createElement('div');
        catDiv.className = 'category';

        // display translated label if available, otherwise category as-is
        const arabicLabel = translations[category] || category;
        const h = document.createElement('h2');
        h.textContent = arabicLabel;
        catDiv.appendChild(h);

        // if original category is different (e.g., English), show it as subtitle
        if (arabicLabel !== category) {
          const sub = document.createElement('div');
          sub.className = 'subtitle';
          sub.textContent = '(' + category + ')';
          catDiv.appendChild(sub);
        }

        grouped[category].forEach(p => {
          const div = document.createElement('div');
          div.className = 'product';
          const img = document.createElement('img');
          img.src = p.images && p.images[0] ? p.images[0] : 'placeholder.png';
          img.alt = p.model || p.brand;
          const info = document.createElement('div');
          info.className = 'info';
          const name = document.createElement('div');
          name.className = 'name';
          name.textContent = (p.brand ? p.brand + ' ' : '') + (p.model || p.name || '');
          const desc = document.createElement('div');
          desc.className = 'desc';
          desc.textContent = p.description || '';
          info.appendChild(name);
          info.appendChild(desc);
          if (p.tags && p.tags.length) {
            const tags = document.createElement('div');
            tags.className = 'tags';
            p.tags.forEach(t => { const s = document.createElement('span'); s.className='tag'; s.textContent = t; tags.appendChild(s); });
            info.appendChild(tags);
          }
          div.appendChild(img);
          div.appendChild(info);
          catDiv.appendChild(div);
        });
        container.appendChild(catDiv);
      }
    })
    .catch(e => {
      document.getElementById('content').textContent = 'فشل تحميل المنتجات.';
      console.error(e);
    });
  </script>
</body>
</html>
