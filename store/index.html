<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>متجر الإلكترونيات</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; direction: rtl; background:#fff; color:#222 }
    .topbar { display:flex; align-items:center; justify-content:space-between }
    .lang-switch { display:flex; gap:8px }
    .lang-btn { padding:6px 10px; border-radius:6px; border:1px solid #ddd; background:#fff; cursor:pointer; font-size:14px }
    .lang-btn.active { background:#0366d6; color:#fff; border-color: #0366d6 }
    .category { margin-top: 24px; }
    .category h2 { margin: 0 0 8px 0; }
    .category .subtitle { color:#555; font-size:13px; margin-bottom:6px }
    .product { border: 1px solid #eee; padding: 10px; margin: 8px 0; border-radius: 6px; display:flex; align-items:center }
    .product img { max-width: 80px; max-height:80px; object-fit:cover; border-radius:6px; margin-left:12px }
    .info { flex:1 }
    .name { font-weight: bold; margin-bottom:6px }
    .desc { color:#555; font-size:14px }
    .tags { margin-top:8px }
    .tag { background:#f0f0f0;padding:4px 8px;border-radius:12px;margin-left:6px;font-size:12px;display:inline-block }
    h1 { margin-top:0 }
  </style>
</head>
<body>
  <div class="topbar">
    <h1 id="page-title">فئات المبيعات — أجهزة إلكترونية</h1>
    <div class="lang-switch" aria-label="Language switch">
      <button id="btn-ar" class="lang-btn">العربية</button>
      <button id="btn-en" class="lang-btn">English</button>
    </div>
  </div>

  <div id="content">جارٍ التحميل...</div>

  <script>
    // Language switcher: saves selection in localStorage as 'lang' ('ar' or 'en')
    const btnAr = document.getElementById('btn-ar');
    const btnEn = document.getElementById('btn-en');
    function setActiveButton(lang) {
      if (lang === 'ar') {
        btnAr.classList.add('active'); btnEn.classList.remove('active');
      } else {
        btnEn.classList.add('active'); btnAr.classList.remove('active');
      }
    }

    function setPageDirection(lang) {
      if (lang === 'ar') {
        document.documentElement.lang = 'ar';
        document.documentElement.dir = 'rtl';
      } else {
        document.documentElement.lang = 'en';
        document.documentElement.dir = 'ltr';
      }
    }

    let lang = localStorage.getItem('lang') || 'ar';
    setActiveButton(lang);
    setPageDirection(lang);

    btnAr.addEventListener('click', () => { lang = 'ar'; localStorage.setItem('lang', lang); setActiveButton(lang); setPageDirection(lang); renderProducts(currentProducts, currentTranslations); });
    btnEn.addEventListener('click', () => { lang = 'en'; localStorage.setItem('lang', lang); setActiveButton(lang); setPageDirection(lang); renderProducts(currentProducts, currentTranslations); });

    let currentProducts = [];
    let currentTranslations = {};

    // Load data
    Promise.all([
      fetch('products.json').then(r => r.json()),
      fetch('translations.json').then(r => r.json()).catch(() => ({}))
    ])
    .then(([products, translations]) => {
      currentProducts = products;
      currentTranslations = translations;
      renderProducts(products, translations);
    })
    .catch(e => {
      document.getElementById('content').textContent = 'فشل تحميل المنتجات.';
      console.error(e);
    });

    function renderProducts(products, translations) {
      // Build reverse map: arabic -> english (for categories that are stored in Arabic)
      const rev = {};
      Object.entries(translations).forEach(([en, ar]) => { rev[ar] = en; });

      // Group products by english key (determine canonical English key)
      const grouped = {};
      products.forEach(p => {
        const possibleEnglish = rev[p.category] || p.category; // if p.category is Arabic and in translations, map to English
        const englishKey = possibleEnglish;
        grouped[englishKey] = grouped[englishKey] || [];
        grouped[englishKey].push(p);
      });

      const container = document.getElementById('content');
      container.innerHTML = '';

      for (const englishKey in grouped) {
        const catDiv = document.createElement('div');
        catDiv.className = 'category';

        // Determine label to show based on lang
        const arLabel = translations[englishKey] || rev[englishKey] || englishKey;
        const enLabel = englishKey;
        const label = (lang === 'ar') ? (arLabel) : enLabel;

        const h = document.createElement('h2');
        h.textContent = label;
        catDiv.appendChild(h);

        // if showing Arabic but original english label exists, show english subtitle
        if (lang === 'ar' && enLabel && enLabel !== arLabel) {
          const sub = document.createElement('div');
          sub.className = 'subtitle';
          sub.textContent = '(' + enLabel + ')';
          catDiv.appendChild(sub);
        }
        // if showing English and arabic label exists, show arabic subtitle
        if (lang === 'en' && arLabel && arLabel !== enLabel) {
          const sub = document.createElement('div');
          sub.className = 'subtitle';
          sub.textContent = '(' + arLabel + ')';
          catDiv.appendChild(sub);
        }

        grouped[englishKey].forEach(p => {
          const div = document.createElement('div');
          div.className = 'product';
          const img = document.createElement('img');
          img.src = p.images && p.images[0] ? p.images[0] : 'placeholder.png';
          img.alt = p.model || p.brand;
          const info = document.createElement('div');
          info.className = 'info';
          const name = document.createElement('div');
          name.className = 'name';
          // Show product name localized: brand + model (brand stays as-is)
          if (lang === 'ar') {
            // if model is English but translations map exists for category only; keep product model as-is
            name.textContent = (p.brand ? p.brand + ' ' : '') + (p.model || p.name || '');
          } else {
            name.textContent = (p.brand ? p.brand + ' ' : '') + (p.model || p.name || '');
          }
          const desc = document.createElement('div');
          desc.className = 'desc';
          desc.textContent = p.description || '';
          info.appendChild(name);
          info.appendChild(desc);
          if (p.tags && p.tags.length) {
            const tags = document.createElement('div');
            tags.className = 'tags';
            p.tags.forEach(t => { const s = document.createElement('span'); s.className='tag'; s.textContent = t; tags.appendChild(s); });
            info.appendChild(tags);
          }
          div.appendChild(img);
          div.appendChild(info);
          catDiv.appendChild(div);
        });

        container.appendChild(catDiv);
      }

      // update page title localization
      const pageTitle = document.getElementById('page-title');
      pageTitle.textContent = (lang === 'ar') ? 'فئات المبيعات — أجهزة إلكترونية' : 'Sales categories — Electronics';
    }
  </script>
</body>
</html>
